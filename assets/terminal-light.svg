<svg xmlns="http://www.w3.org/2000/svg" width="852" height="222" viewBox="0 0 852 222" role="img" aria-label="bakery booting in development: the schema checked against the database, then the server listening on port 3000">
  <rect width="852" height="222" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <path d="M0 10a10 10 0 0 1 10-10h832a10 10 0 0 1 10 10v24H0z" fill="#f6f8fa"/>
  <line x1="0" y1="34" x2="852" y2="34" stroke="#d0d7de"/>
  <circle cx="19" cy="17" r="5.5" fill="#ff5f57"/>
  <circle cx="38" cy="17" r="5.5" fill="#febc2e"/>
  <circle cx="57" cy="17" r="5.5" fill="#28c840"/>
  <text x="76" y="21" font-family="Google Sans, Google Sans Text, ui-sans-serif, system-ui, Segoe UI, Roboto, sans-serif" font-size="11.5" fill="#6e7781">my-app — bakery</text>
  <g font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0">
    <text x="20" y="71.9" xml:space="preserve"><tspan style="fill:#24292f" xml:space="preserve">[I] process        </tspan><tspan style="fill:#24292f" xml:space="preserve"> Starting server (PID: 7360)...</tspan><tspan style="fill:#24292f" xml:space="preserve"> </tspan></text>
    <text x="20" y="93.0" xml:space="preserve"><tspan style="fill:#24292f" xml:space="preserve">[I] serve          </tspan><tspan style="fill:#24292f" xml:space="preserve"> Starting server in </tspan><tspan style="fill:#0550ae" xml:space="preserve">development</tspan><tspan style="fill:#24292f" xml:space="preserve"> mode...</tspan><tspan style="fill:#24292f" xml:space="preserve"> </tspan></text>
    <text x="20" y="114.0" xml:space="preserve"><tspan style="fill:#24292f" xml:space="preserve">[I] serve          </tspan><tspan style="fill:#24292f" xml:space="preserve"> Schema unchanged since last sync — </tspan><tspan style="fill:#9a6700" xml:space="preserve">skipping schema sync</tspan><tspan style="fill:#24292f" xml:space="preserve"> (</tspan><tspan style="fill:#0550ae" xml:space="preserve">--sync</tspan><tspan style="fill:#24292f" xml:space="preserve"> forces it)</tspan><tspan style="fill:#24292f" xml:space="preserve"> </tspan></text>
    <text x="20" y="135.1" xml:space="preserve"><tspan style="fill:#24292f" xml:space="preserve">[I] serve          </tspan><tspan style="fill:#24292f" xml:space="preserve"> </tspan><tspan style="fill:#1a7f37" xml:space="preserve">Server running at:</tspan><tspan style="fill:#24292f" xml:space="preserve"> </tspan></text>
    <text x="20" y="156.1" xml:space="preserve"><tspan style="fill:#24292f" xml:space="preserve">[I] serve          </tspan><tspan style="fill:#24292f" xml:space="preserve">   ➜ </tspan><tspan style="fill:#24292f" xml:space="preserve">Local  </tspan><tspan style="fill:#24292f" xml:space="preserve">: </tspan><tspan style="fill:#0969da" xml:space="preserve">http://localhost:3000</tspan><tspan style="fill:#24292f" xml:space="preserve"> </tspan></text>
    <text x="20" y="177.2" xml:space="preserve"><tspan style="fill:#24292f" xml:space="preserve">[I] serve          </tspan><tspan style="fill:#24292f" xml:space="preserve">   ➜ </tspan><tspan style="fill:#24292f" xml:space="preserve">Network</tspan><tspan style="fill:#24292f" xml:space="preserve">: </tspan><tspan style="fill:#0969da" xml:space="preserve">http://192.168.1.24:3000</tspan><tspan style="fill:#24292f" xml:space="preserve"> </tspan></text>
    <text x="20" y="198.3" xml:space="preserve"><tspan style="fill:#24292f" xml:space="preserve">[I] serve          </tspan><tspan style="fill:#24292f" xml:space="preserve"> Rate limit: </tspan><tspan style="fill:#9a6700" xml:space="preserve">100</tspan><tspan style="fill:#24292f" xml:space="preserve"> burst / </tspan><tspan style="fill:#9a6700" xml:space="preserve">10</tspan><tspan style="fill:#24292f" xml:space="preserve"> req/s per IP (default) — set </tspan><tspan style="fill:#0550ae" xml:space="preserve">rateLimit: false</tspan><tspan style="fill:#24292f" xml:space="preserve"> to disable</tspan><tspan style="fill:#24292f" xml:space="preserve"> </tspan></text>
  </g>
</svg>
