name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# A newer push to the same branch makes the older run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Floor and latest, because they have diverged and the divergence has
    # already bitten: Bun 1.4.0 rejects accessor descriptors on process.env,
    # and a suite pinned to anything older stayed green while every entry into
    # the framework died on import under current Bun. The floor entry keeps the
    # engines claim honest; latest catches the next removal early.
    #
    # The Windows entry exists for the same reason from the other side. Two
    # defects in two days were Windows-only and invisible here — a glob escape
    # that treats  as a path separator, and the accessor removal was *found*
    # on Windows first — so one job runs the suite where those live. No
    # database services: service containers are Linux-only, so the live
    # adapter tests skip there exactly as they do on a dev machine without
    # servers, and the adapters job below stays the authority on those.
    name: test + typecheck (bun ${{ matrix.bun }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, bun: 1.4.0 }
          - { os: ubuntu-latest, bun: latest }
          - { os: windows-latest, bun: latest }
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}

      - run: bun install --frozen-lockfile

      # Runs every suite under packages/ and tests/, including
      # tests/conventions.test.ts, which is what keeps the repo conventions
      # from rotting across six packages. Deliberately no count here: a number
      # in a comment is stale by the next commit that adds a test.
      - name: Test
        run: bun run test

      # Nine projects, and the baseline is zero. Not "zero new" — zero. tsc
      # exits non-zero on any error, so this needs no threshold logic.
      - name: Typecheck
        run: bun run typecheck

  adapters:
    name: live adapter round-trips
    runs-on: ubuntu-latest

    # MySQL and Postgres were trusted on faith while their quoting,
    # placeholders and DDL were edited repeatedly; six real defects turned up
    # the moment anything looked. Only SQLite can be exercised without a
    # server, so these two get one here.
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: bakery
          MYSQL_DATABASE: bakery_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pbakery"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: bakery
          POSTGRES_DB: bakery_test
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      # ?sslmode=require is load-bearing on Bun 1.4: it refuses RSA public-key
      # retrieval over an insecure connection, which MySQL 8's default
      # caching_sha2_password needs, and the failure presents as "Connection
      # closed" — indistinguishable from the container being down.
      MYSQL_TEST_URL: mysql://root:bakery@127.0.0.1:3306/bakery_test?sslmode=require
      PGSQL_TEST_URL: postgres://postgres:bakery@127.0.0.1:5432/bakery_test

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: ORM suite against real MySQL and Postgres
        run: bun test ./packages/orm 2>&1 | tee orm-test.log

      # The gated tests report as *skipped* without a connection string, so a
      # misconfigured service container yields a green job that tested nothing
      # against a real server -- the exact outcome this job exists to prevent.
      # Anything skipped here means the URLs did not reach the tests.
      - name: Fail if the live tests were skipped rather than run
        run: |
          if grep -qE "^ *[1-9][0-9]* skip" orm-test.log; then
            echo "::error::Adapter tests were SKIPPED in the live job."
            echo "MYSQL_TEST_URL / PGSQL_TEST_URL did not reach the suite, so"
            echo "nothing ran against a real server. Green here would be a lie."
            grep -E "^ *[0-9]+ (pass|skip|fail)" orm-test.log
            exit 1
          fi
          echo "No skips: the live half genuinely ran."
