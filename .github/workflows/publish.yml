name: Publish

# The only thing here that touches the registry, and the only one that cannot
# be undone: npm never allows a version number to be reused, by anyone, ever.
# So it fires on a tag rather than on a push — `version.yml` creates the tag,
# and a human can also create one by hand.
#
# Authentication is **npm Trusted Publishing (OIDC)**: no long-lived token
# exists anywhere, not in this repository's secrets and not on anyone's laptop.
# npm mints a short-lived credential for this exact workflow in this exact
# repository. Two consequences worth knowing before editing this file:
#
#   - Trusted publishing is configured **per package** on npmjs.com, and it
#     names *this file*. Renaming publish.yml, or moving the job, breaks the
#     trust relationship and every publish 403s until the config is updated.
#   - It cannot perform a package's *first* publish — npm has nowhere to attach
#     the trusted publisher until the package exists. Release one is done by
#     hand with a local token; everything after comes through here.
# Two triggers, and the second is not a convenience.
#
# **A tag pushed by `version.yml` cannot start this workflow.** GitHub refuses
# to create workflow runs from events made with the default `GITHUB_TOKEN`, to
# prevent recursion — so the `push: tags` trigger only ever fires for a tag a
# human pushes. The first automated release proved it: v1.0.1 was tagged and
# nothing ran.
#
# `workflow_dispatch` is one of the two documented exemptions (with
# `repository_dispatch`), so version.yml calls this explicitly instead.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish, e.g. v1.2.3'
        required: true
        type: string

concurrency:
  # Two runs publishing the same tag would race, and the loser would fail
  # halfway through the seven packages. Never cancel a run mid-publish.
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  # The whole point. Without it the runner cannot mint the OIDC token and npm
  # falls back to looking for a credential that does not exist.
  id-token: write

jobs:
  publish:
    name: seven packages
    runs-on: ubuntu-latest

    # One name for the tag whichever trigger fired. On a tag push `ref_name` is
    # the tag; on a dispatch it is the branch, so the input has to win.
    env:
      TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Explicit, because a dispatched run would otherwise check out the
          # branch and publish whatever is on it rather than what was tagged.
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # npm does the publishing, so it needs a Node it supports. The runner's
      # bundled npm predates OIDC support often enough that pinning is cheaper
      # than debugging a 401 that claims to be about permissions.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Use an npm that speaks OIDC
        run: |
          npm install -g npm@latest
          npm --version

      - run: bun install --frozen-lockfile

      # A tag can be created by hand, and by hand it can be put on the wrong
      # commit. Publishing then ships whatever the manifests happen to say
      # under a tag claiming something else — and both are permanent.
      - name: Refuse if the tag and the manifests disagree
        run: |
          manifest=$(bun -e 'console.log(require("./package.json").version)')
          if [ "v$manifest" != "$TAG" ]; then
            echo "tag $TAG does not match the manifest version $manifest" >&2
            exit 1
          fi
          echo "tag and manifests agree on $manifest"

      # The dist-tag is derived from the version, never passed in. A prerelease
      # published without one becomes `latest`, and then every plain
      # `bun add @bakery-framework/core` in the world resolves to a beta —
      # silently, and only fixable by re-tagging after people have installed it.
      # An unrecognised prerelease is refused rather than defaulted.
      - name: Work out the dist-tag
        id: disttag
        run: |
          version="${TAG#v}"
          case "$version" in
            *-alpha.*) tag=alpha ;;
            *-beta.*)  tag=beta ;;
            *-rc.*)    tag=rc ;;
            *-*)       echo "unrecognised prerelease in $version" >&2; exit 1 ;;
            *)         tag=latest ;;
          esac
          echo "value=$tag" >> "$GITHUB_OUTPUT"
          echo "publishing $version under dist-tag $tag"

      # Run again rather than trusted from the tagged commit's earlier run: a
      # tag can be moved, a branch force-pushed. Last point anything stops.
      - name: Test
        run: bun run test

      - name: Typecheck
        run: bun run typecheck

      # **Bun packs, npm publishes, and the split is load-bearing.**
      #
      # `workspace:^` is a Bun/pnpm protocol that npm does not understand. Bun
      # rewrites it to a real range when it builds a tarball; npm does not.
      # Measured on @bakery-framework/orm:
      #
      #   npm pack     -> "@bakery-framework/core": "workspace:^"   (broken)
      #   bun pm pack  -> "@bakery-framework/core": "^1.0.0"        (correct)
      #
      # So publishing straight from the working tree with npm would ship seven
      # manifests that no consumer can resolve, permanently. Packing with Bun
      # and handing npm a finished tarball keeps Bun's rewriting *and* gets
      # OIDC, because npm publishes the bytes it is given.
      - name: Pack every package with Bun
        run: |
          set -e
          mkdir -p dist
          for pkg in \
            packages/core \
            packages/orm \
            packages/cli \
            packages/plugins/vue \
            packages/plugins/analytics \
            packages/plugins/dashboard \
            packages/create
          do
            ( cd "$pkg" && bun pm pack --destination "$GITHUB_WORKSPACE/dist" )
          done
          ls -l dist

      # Guards the paragraph above. If a future Bun stops rewriting the
      # protocol, this fails here rather than shipping unresolvable manifests.
      # The name deliberately avoids a trailing colon. `name: … workspace:`
      # parses as a nested mapping key, and GitHub rejects the whole file with
      # "Invalid workflow file" — while `js-yaml` locally accepts it, so the
      # error is invisible until the workflow refuses to run at all.
      - name: Refuse if any tarball still carries a workspace range
        run: |
          set -e
          for tgz in dist/*.tgz; do
            if tar -xzOf "$tgz" package/package.json | grep -q '"workspace:'; then
              echo "$tgz still contains a workspace: range" >&2
              exit 1
            fi
          done
          echo "no workspace: ranges in any tarball"

      # Dependency order: core, then everything depending on it, then the
      # scaffolder that references them all. It does not affect whether a
      # publish succeeds — npm does not check that a dependency exists — but it
      # decides what a consumer sees if they install while this is half done.
      - name: Publish
        env:
          DIST_TAG: ${{ steps.disttag.outputs.value }}
        run: |
          set -e
          for name in \
            bakery-framework-core \
            bakery-framework-orm \
            bakery-framework-cli \
            bakery-framework-plugin-vue \
            bakery-framework-plugin-analytics \
            bakery-framework-plugin-dashboard \
            create-bakery
          do
            tgz=$(ls dist/${name}-*.tgz)
            echo "::group::$name"
            npm publish "$tgz" --tag "$DIST_TAG"
            echo "::endgroup::"
          done

      - name: Summary
        env:
          DIST_TAG: ${{ steps.disttag.outputs.value }}
        run: |
          {
            echo "### Published $TAG under \`$DIST_TAG\`"
            echo
            echo "Authenticated by OIDC — no token was used."
            echo
            if [ "$DIST_TAG" = latest ]; then
              echo '```'
              echo 'bun add @bakery-framework/core'
              echo '```'
            else
              echo "Consumers opt in explicitly:"
              echo '```'
              echo "bun add @bakery-framework/core@$DIST_TAG"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
