<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bakery</title>
<meta name="description" content="A full-stack framework for Bun: file-system routing, server-rendered JSX, a typed ORM with schema sync, and a plugin system.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥖</text></svg>">
<style>
/*
  Hand-written, no build step and no CDN — the site is one file plus the .md
  sources it renders. That is deliberate: `docs/*.md` stays the single source of
  truth, so `tests/docs-examples.test.ts` still compiles every example in it.
  A generator would either fork the content or move it out of that test's reach.
*/
:root {
  /* Tells the browser to render *native* UI — scrollbars, the search input's
     clear button, focus rings — in the matching scheme. Without it the page
     goes dark and the scrollbar stays white, which is the one piece of chrome
     no amount of custom CSS reaches on its own. */
  color-scheme: light;
  --brand: #c2681a;
  --brand-soft: #e08c3e;
  --bg: #ffffff;
  --bg-alt: #f6f6f7;
  --bg-code: #f9f7f4;
  --text: #3c3c43;
  --text-strong: #1b1b1f;
  --text-mute: #67676c;
  --border: #e2e2e3;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 12px rgba(0,0,0,.06);
  --nav-h: 56px;
  --sidebar-w: 260px;
  --aside-w: 220px;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --brand: #e8974a;
  --brand-soft: #f0a962;
  --bg: #1b1b1f;
  --bg-alt: #202127;
  --bg-code: #161618;
  --text: #c9c9cc;
  --text-strong: #ffffff;
  --text-mute: #8e8e93;
  --border: #2e2e32;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 12px rgba(0,0,0,.4);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --brand: #e8974a; --brand-soft: #f0a962;
    --bg: #1b1b1f; --bg-alt: #202127; --bg-code: #161618;
    --text: #c9c9cc; --text-strong: #ffffff; --text-mute: #8e8e93;
    --border: #2e2e32;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 12px rgba(0,0,0,.4);
  }
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: calc(var(--nav-h) + 16px); }

/* Both engines, because they disagree: Firefox takes `scrollbar-*`, WebKit and
   Chromium take the pseudo-elements. Both read the theme variables, so the
   thumb tracks light/dark without a second rule. */
* { scrollbar-width: thin; scrollbar-color: color-mix(in srgb, var(--text-mute) 45%, transparent) transparent; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  /* Padded via a transparent border + background-clip so the thumb reads as a
     slim pill rather than filling the gutter edge to edge. */
  background: color-mix(in srgb, var(--text-mute) 45%, transparent);
  border: 2px solid transparent;
  background-clip: content-box;
  border-radius: 8px;
}
::-webkit-scrollbar-thumb:hover { background: color-mix(in srgb, var(--text-mute) 75%, transparent); background-clip: content-box; }
::-webkit-scrollbar-corner { background: transparent; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 16px/1.7 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}

/* ---------- nav ---------- */
.nav {
  position: fixed; inset: 0 0 auto 0; height: var(--nav-h); z-index: 30;
  display: flex; align-items: center; gap: 16px; padding: 0 20px;
  background: color-mix(in srgb, var(--bg) 85%, transparent);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
}
.brand {
  display: flex; align-items: center; gap: 8px;
  font-weight: 700; color: var(--text-strong); text-decoration: none; font-size: 17px;
}
.badge {
  font: 600 11px/1 var(--mono); padding: 4px 6px; border-radius: 5px;
  background: color-mix(in srgb, var(--brand) 14%, transparent); color: var(--brand);
}
.nav-spacer { flex: 1; }
.search-wrap { position: relative; }
#search {
  width: 200px; padding: 7px 10px 7px 30px; font-size: 13px; font-family: inherit;
  color: var(--text); background: var(--bg-alt);
  border: 1px solid var(--border); border-radius: 8px; outline: none;
}
#search:focus { border-color: var(--brand); width: 260px; }
.search-icon {
  position: absolute; left: 9px; top: 50%; transform: translateY(-50%);
  width: 14px; height: 14px; color: var(--text-mute); pointer-events: none;
}
.results {
  position: absolute; top: calc(100% + 6px); right: 0; width: min(460px, 80vw);
  max-height: 60vh; overflow-y: auto; overflow-x: hidden; background: var(--bg);
  border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow);
  display: none; padding: 6px;
}
.results.open { display: block; }
.results a { display: block; padding: 8px 10px; border-radius: 7px; text-decoration: none; color: var(--text); overflow: hidden; }
.results a:hover, .results a.sel { background: var(--bg-alt); }
/* All three are spans, so each needs `display:block` — without it the crumb,
   title and snippet run together on one line ("ARCHITECTUREArchitecture…"). */
.results .r-title { display: block; font-weight: 600; color: var(--text-strong); font-size: 14px; line-height: 1.4; }
.results .r-crumb { display: block; font-size: 11px; color: var(--brand); text-transform: uppercase; letter-spacing: .04em; }
.results .r-snip { display: block; font-size: 12px; color: var(--text-mute); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.results .empty { padding: 14px; color: var(--text-mute); font-size: 13px; text-align: center; }
/* Every icon is an inline SVG sized identically and filled with currentColor.
   These were text glyphs — "◐" and "⌥" — which sit on different optical
   baselines, cannot be aligned reliably, and vary by installed font. "⌥" is the
   Mac option key, which was standing in for a GitHub mark that did not exist. */
.icon-btn {
  display: grid; place-items: center; width: 32px; height: 32px; flex: none;
  background: none; border: 0; border-radius: 7px; cursor: pointer;
  color: var(--text-mute); padding: 0; line-height: 0;
}
.icon-btn svg { display: block; width: 18px; height: 18px; }
.icon-btn:hover { background: var(--bg-alt); color: var(--text-strong); }
#menu-btn { display: none; }

/* ---------- layout ---------- */
.sidebar {
  position: fixed; top: var(--nav-h); bottom: 0; left: 0; width: var(--sidebar-w);
  overflow-y: auto; padding: 24px 12px 60px 20px; z-index: 20;
  background: var(--bg); border-right: 1px solid var(--border);
}
.sb-group { margin-bottom: 20px; }
.sb-title {
  font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
  color: var(--text-strong); padding: 0 10px; margin-bottom: 6px;
}
.sb-link {
  display: block; padding: 5px 10px; border-radius: 7px; font-size: 14px;
  color: var(--text-mute); text-decoration: none;
}
.sb-link:hover { color: var(--text-strong); background: var(--bg-alt); }
.sb-link.active { color: var(--brand); font-weight: 600; background: color-mix(in srgb, var(--brand) 10%, transparent); }

.shell { display: flex; justify-content: center; padding-top: var(--nav-h); }
main {
  flex: 1; min-width: 0; max-width: 760px;
  margin-left: var(--sidebar-w); padding: 36px 32px 96px;
}
.aside {
  position: sticky; top: calc(var(--nav-h) + 36px); align-self: flex-start;
  width: var(--aside-w); flex: none; padding: 36px 20px 0 8px;
  max-height: calc(100vh - var(--nav-h) - 36px); overflow-y: auto;
}
.aside-title { font-size: 12px; font-weight: 700; color: var(--text-strong); margin-bottom: 8px; text-transform: uppercase; letter-spacing: .05em; }
.aside a {
  display: block; padding: 3px 0 3px 10px; font-size: 13px; line-height: 1.5;
  color: var(--text-mute); text-decoration: none; border-left: 2px solid var(--border);
}
.aside a:hover { color: var(--text-strong); }
.aside a.active { color: var(--brand); border-left-color: var(--brand); }
.aside a.lvl3 { padding-left: 22px; font-size: 12.5px; }

/* ---------- content ---------- */
.md h1 { font-size: 2.1rem; line-height: 1.25; font-weight: 700; color: var(--text-strong); margin: 0 0 10px; letter-spacing: -.02em; }
.md h2 {
  font-size: 1.45rem; font-weight: 650; color: var(--text-strong);
  margin: 44px 0 14px; padding-top: 22px; border-top: 1px solid var(--border); letter-spacing: -.01em;
}
.md h3 { font-size: 1.15rem; font-weight: 650; color: var(--text-strong); margin: 30px 0 10px; }
.md h4 { font-size: 1rem; font-weight: 650; color: var(--text-strong); margin: 22px 0 8px; }
.md p { margin: 14px 0; }
.md a { color: var(--brand); text-decoration: none; font-weight: 500; }
.md a:hover { text-decoration: underline; }
.md strong { color: var(--text-strong); font-weight: 650; }
.md ul, .md ol { padding-left: 24px; margin: 14px 0; }
.md li { margin: 6px 0; }
.md li > ul, .md li > ol { margin: 6px 0; }
.md hr { border: 0; border-top: 1px solid var(--border); margin: 32px 0; }
.md blockquote {
  margin: 18px 0; padding: 14px 18px; border-radius: 8px;
  background: color-mix(in srgb, var(--brand) 8%, transparent);
  border-left: 3px solid var(--brand);
}
.md blockquote > :first-child { margin-top: 0; }
.md blockquote > :last-child { margin-bottom: 0; }
.md code {
  font-family: var(--mono); font-size: .86em;
  background: color-mix(in srgb, var(--text-mute) 16%, transparent);
  padding: .18em .38em; border-radius: 4px; color: var(--text-strong);
}
.md pre {
  margin: 18px 0; padding: 18px 20px; overflow-x: auto;
  background: var(--bg-code); border: 1px solid var(--border); border-radius: 10px;
  font-family: var(--mono); font-size: 13.5px; line-height: 1.6;
}
.md pre code { background: none; padding: 0; font-size: inherit; color: var(--text); }
.code-wrap { position: relative; }
.code-lang {
  position: absolute; top: 10px; right: 12px; font: 600 10px/1 var(--mono);
  text-transform: uppercase; letter-spacing: .06em; color: var(--text-mute); pointer-events: none;
}
.copy-btn {
  position: absolute; top: 8px; right: 8px; padding: 4px 8px; font-size: 11px;
  background: var(--bg); color: var(--text-mute); border: 1px solid var(--border);
  border-radius: 6px; cursor: pointer; opacity: 0; transition: opacity .15s;
}
.code-wrap:hover .copy-btn { opacity: 1; }
.code-wrap:hover .code-lang { opacity: 0; }
.copy-btn:hover { color: var(--brand); border-color: var(--brand); }
.md table { width: 100%; border-collapse: collapse; margin: 18px 0; font-size: 14px; display: block; overflow-x: auto; }
.md th, .md td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; vertical-align: top; }
.md th { background: var(--bg-alt); font-weight: 650; color: var(--text-strong); }
.md .anchor { color: var(--text-mute); opacity: 0; margin-left: .4em; font-weight: 400; text-decoration: none; }
.md h2:hover .anchor, .md h3:hover .anchor, .md h4:hover .anchor { opacity: 1; }

/* syntax */
.tok-c { color: #8b8b90; font-style: italic; }
.tok-s { color: #a3782c; }
.tok-k { color: #b1441f; }
.tok-n { color: #7a5cc4; }
.tok-f { color: #2a6fb5; }
:root[data-theme="dark"] .tok-s { color: #d9b26a; }
:root[data-theme="dark"] .tok-k { color: #f08b62; }
:root[data-theme="dark"] .tok-n { color: #c9a2f5; }
:root[data-theme="dark"] .tok-f { color: #79b8ff; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .tok-s { color: #d9b26a; }
  :root:not([data-theme="light"]) .tok-k { color: #f08b62; }
  :root:not([data-theme="light"]) .tok-n { color: #c9a2f5; }
  :root:not([data-theme="light"]) .tok-f { color: #79b8ff; }
}

.pager { display: flex; gap: 12px; margin-top: 56px; padding-top: 22px; border-top: 1px solid var(--border); }
.pager a {
  flex: 1; padding: 14px 16px; border: 1px solid var(--border); border-radius: 10px;
  text-decoration: none; color: var(--text-strong); font-weight: 600; font-size: 14px;
}
.pager a:hover { border-color: var(--brand); color: var(--brand); }
.pager .p-dir { display: block; font-size: 11px; color: var(--text-mute); font-weight: 500; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 3px; }
.pager .next { text-align: right; }
.edit-link { margin-top: 30px; font-size: 13.5px; }

.scrim { display: none; position: fixed; inset: var(--nav-h) 0 0; background: rgba(0,0,0,.4); z-index: 19; }
/* 1100, not 1280: `main` is flex:1 with min-width:0, so it simply narrows to
   make room. Hiding the contents at exactly 1280 lost it on the single most
   common laptop width for no layout reason. */
@media (max-width: 1100px) { .aside { display: none; } }
@media (max-width: 960px) {
  #menu-btn { display: grid; }
  .sidebar { transform: translateX(-100%); transition: transform .2s ease; box-shadow: var(--shadow); }
  body.menu-open .sidebar { transform: none; }
  body.menu-open .scrim { display: block; }
  main { margin-left: 0; padding: 28px 20px 80px; }
  #search { width: 130px; } #search:focus { width: 170px; }
}
/* Below ~600px the nav ran out of room and pushed the GitHub link off-screen
   entirely (445px of content in a 388px viewport). Rather than pick a smaller
   fixed width — which only moves the breakpoint where it overflows again — the
   search field absorbs whatever is left after the fixed-size items. */
@media (max-width: 600px) {
  .nav { padding: 0 12px; gap: 8px; }
  .nav-spacer { display: none; }
  .badge { display: none; }
  .search-wrap { flex: 1; min-width: 0; }
  #search, #search:focus { width: 100%; }
  .results { width: min(320px, calc(100vw - 24px)); }
}
</style>
</head>
<body>

<nav class="nav">
  <button class="icon-btn" id="menu-btn" aria-label="Open navigation" title="Menu">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
  <a class="brand" href="#/"><span>🥖</span> Bakery <span class="badge" id="ver">v4</span></a>
  <span class="nav-spacer"></span>
  <div class="search-wrap">
    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
    <input id="search" type="search" placeholder="Search docs…" autocomplete="off" spellcheck="false" aria-label="Search documentation">
    <div class="results" id="results"></div>
  </div>
  <button class="icon-btn" id="theme-btn" aria-label="Toggle theme" title="Toggle theme">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.25" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M12 2.75a9.25 9.25 0 0 1 0 18.5z" fill="currentColor"/></svg>
  </button>
  <a class="icon-btn" href="https://github.com/obillekyle/bun-server" target="_blank" rel="noopener" aria-label="GitHub repository" title="GitHub">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.6 7.6 0 0 1 2-.27c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
  </a>
</nav>

<aside class="sidebar" id="sidebar"></aside>
<div class="scrim" id="scrim"></div>

<div class="shell">
  <main><article class="md" id="content">Loading…</article><div id="pager"></div></main>
  <nav class="aside" id="aside"></nav>
</div>

<script>
/* ------------------------------------------------------------------ nav data
   Explicit rather than derived from README.md: the sidebar order is an editorial
   decision, and parsing it out of prose would make a heading rename silently
   reshuffle the site. Adding a page means adding a line here.                */
const NAV = [
  { title: 'Getting started', items: [
    ['getting-started/installation', 'Installation'],
    ['getting-started/first-app', 'Your first app'],
    ['getting-started/project-structure', 'Project structure'],
  ]},
  { title: 'Guides', items: [
    ['guides/routing', 'Routing'],
    ['guides/api-routes', 'API routes'],
    ['guides/middleware', 'Middleware'],
    ['guides/static-assets', 'Static assets'],
    ['guides/proxy', 'Proxy'],
    ['guides/websockets', 'WebSockets'],
    ['guides/sessions', 'Sessions'],
  ]},
  { title: 'Configuration', items: [
    ['configuration/server-config', 'server.config.ts'],
    ['configuration/multi-host', 'Multi-host'],
    ['configuration/environment', 'Environment'],
  ]},
  { title: 'Database', items: [
    ['orm/schema', 'Schema'],
    ['orm/queries', 'Queries'],
    ['orm/mutations', 'Mutations'],
    ['orm/sync', 'Schema sync'],
    ['orm/adapters', 'Adapters'],
  ]},
  { title: 'Plugins', items: [
    ['plugins/plugin-api', 'Plugin API'],
    ['plugins/vue', 'Vue'],
    ['plugins/analytics', 'Analytics'],
    ['plugins/dashboard', 'Dashboard'],
  ]},
  { title: 'Deployment', items: [
    ['deployment/production', 'Production'],
    ['deployment/security', 'Security'],
  ]},
  { title: 'Reference', items: [
    ['reference/cli', 'CLI'],
    ['reference/architecture', 'Architecture'],
    ['reference/troubleshooting', 'Troubleshooting'],
  ]},
]
const FLAT = [['README', 'Introduction'], ...NAV.flatMap(g => g.items)]
const REPO = 'https://github.com/obillekyle/bun-server'

/* ------------------------------------------------------------------ markdown
   Small on purpose. It covers what these docs actually use — headings, fenced
   code, tables, nested lists, blockquotes, inline spans — and nothing else. */
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')

/** GitHub's heading-slug rules, so an existing `#anchor` link still lands. */
const slug = s => s.toLowerCase().replace(/`/g, '').replace(/[^\w\s-]/g, '')
  .trim().replace(/\s+/g, '-')

const KEYWORDS = /\b(import|export|from|default|const|let|var|function|return|await|async|if|else|for|while|of|in|new|class|extends|implements|interface|type|enum|as|typeof|keyof|declare|module|namespace|public|private|readonly|static|try|catch|finally|throw|switch|case|break|continue|satisfies|true|false|null|undefined|void|never|any|string|number|boolean|this|super|yield|delete)\b/

/** Token-level highlighting: each piece is escaped as it is emitted, so no
    span markup can ever be produced from the source text itself. */
function highlight(code, lang) {
  if (lang === 'json') lang = 'ts'
  if (!/^(ts|tsx|js|jsx|json|bash|sh)$/.test(lang || '')) return esc(code)
  const shell = lang === 'bash' || lang === 'sh'
  const pattern = shell
    ? /(#[^\n]*)|('[^']*'|"[^"]*")|(\b(?:bun|bunx|npm|npx|git|cd|export|curl|sudo|docker|ls|rm|mkdir)\b)/g
    : /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|('[^'\n]*'|"[^"\n]*"|`[^`]*`)|(\b\d+(?:\.\d+)?\b)|([A-Za-z_$][\w$]*)/g
  let out = '', last = 0, m
  while ((m = pattern.exec(code))) {
    out += esc(code.slice(last, m.index))
    const [txt] = m
    if (m[1]) out += `<span class="tok-${shell ? 'c' : 'c'}">${esc(txt)}</span>`
    else if (m[2]) out += `<span class="tok-s">${esc(txt)}</span>`
    else if (shell) out += `<span class="tok-k">${esc(txt)}</span>`
    else if (m[3]) out += `<span class="tok-n">${esc(txt)}</span>`
    else if (KEYWORDS.test(txt)) out += `<span class="tok-k">${esc(txt)}</span>`
    else if (code[m.index + txt.length] === '(') out += `<span class="tok-f">${esc(txt)}</span>`
    else out += esc(txt)
    last = m.index + txt.length
  }
  return out + esc(code.slice(last))
}

/** Inline spans. Code is extracted first so nothing inside a `code` span is
    re-read as emphasis or a link. */
function inline(s, page) {
  const codes = []
  s = s.replace(/`([^`]+)`/g, (_, c) => `@@CODE${codes.push(c) - 1}@@`)
  s = esc(s)
  s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)[^)]*\)/g, (_, alt, src) => `<img src="${src}" alt="${alt}" style="max-width:100%">`)
  s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_, text, href) => `<a href="${resolveHref(href.trim(), page)}"${/^https?:/.test(href) ? ' target="_blank" rel="noopener"' : ''}>${text}</a>`)
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
  s = s.replace(/(^|[\s(])_([^_]+)_(?=[\s.,)]|$)/g, '$1<em>$2</em>')
  s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>')
  // `[0-9]` rather than `\d`: this file is written by tooling more than once,
  // and a lone backslash in a regex literal is exactly the thing that gets
  // eaten in transit — it already was, turning this into a match for "d+".
  return s.replace(/@@CODE([0-9]+)@@/g, (_, i) => `<code>${esc(codes[i])}</code>`)
}

/**
 * Turn a link as written in the .md into one that works here.
 *
 * Three cases, and the middle one is the whole reason this function exists:
 * a doc-to-doc `../guides/routing.md#anchor` has to become a hash route, or
 * every internal link on the site 404s. Links that leave `docs/` — into
 * `packages/`, or a gitignored maintainer file — go to GitHub instead, since
 * there is nothing here to serve them.
 */
function resolveHref(href, page) {
  if (/^(https?:|mailto:|#)/.test(href)) return href
  const [path, hash] = href.split('#')
  if (!path) return '#' + hash
  const dir = page.includes('/') ? page.slice(0, page.lastIndexOf('/')) : ''
  const parts = (dir ? dir.split('/') : []).concat(path.split('/'))
  const stack = []
  let escaped = false
  for (const part of parts) {
    if (part === '.' || part === '') continue
    if (part === '..') { if (!stack.length) escaped = true; else stack.pop() }
    else stack.push(part)
  }
  const joined = stack.join('/')
  if (escaped || !/\.md$/i.test(path)) return `${REPO}/blob/main/${joined}`
  return `#/${joined.replace(/\.md$/i, '')}${hash ? '#' + hash : ''}`
}

function render(src, page) {
  const lines = src.replace(/\r\n/g, '\n').split('\n')
  let html = '', i = 0
  const toc = []

  while (i < lines.length) {
    const line = lines[i]

    // fenced code
    const fence = /^```(\S*)(.*)$/.exec(line)
    if (fence) {
      const lang = fence[1] || ''
      const buf = []
      i++
      while (i < lines.length && !/^```\s*$/.test(lines[i])) buf.push(lines[i++])
      i++
      const raw = buf.join('\n')
      html += `<div class="code-wrap"><span class="code-lang">${esc(lang || 'text')}</span>` +
        `<button class="copy-btn" type="button">Copy</button>` +
        `<pre><code>${highlight(raw, lang)}</code></pre></div>`
      continue
    }

    // heading
    const h = /^(#{1,6})\s+(.*)$/.exec(line)
    if (h) {
      const lvl = h[1].length, text = h[2].trim(), id = slug(text)
      if (lvl === 2 || lvl === 3) toc.push({ lvl, text: text.replace(/`/g, ''), id })
      const anchor = lvl > 1 ? `<a class="anchor" href="#/${page}#${id}">#</a>` : ''
      html += `<h${lvl} id="${id}">${inline(text, page)}${anchor}</h${lvl}>`
      i++
      continue
    }

    if (/^\s*(---|\*\*\*|___)\s*$/.test(line)) { html += '<hr>'; i++; continue }

    // table
    if (/^\s*\|/.test(line) && /^\s*\|?[\s:|-]+\|/.test(lines[i + 1] || '')) {
      const cells = r => r.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim())
      const head = cells(line)
      i += 2
      let body = ''
      while (i < lines.length && /^\s*\|/.test(lines[i])) {
        body += '<tr>' + cells(lines[i++]).map(c => `<td>${inline(c, page)}</td>`).join('') + '</tr>'
      }
      html += `<table><thead><tr>${head.map(c => `<th>${inline(c, page)}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table>`
      continue
    }

    // blockquote
    if (/^>\s?/.test(line)) {
      const buf = []
      while (i < lines.length && /^>\s?/.test(lines[i])) buf.push(lines[i++].replace(/^>\s?/, ''))
      html += `<blockquote>${render(buf.join('\n'), page).html}</blockquote>`
      continue
    }

    // list — indentation decides nesting, two spaces per level
    if (/^\s*([-*+]|\d+\.)\s+/.test(line)) {
      const items = []
      while (i < lines.length) {
        const m = /^(\s*)([-*+]|\d+\.)\s+(.*)$/.exec(lines[i])
        if (m) {
          items.push({ indent: m[1].length, ordered: /\d/.test(m[2]), text: m[3], cont: [] })
          i++
        } else if (items.length && lines[i].trim() && !/^\s*(#{1,6}|>|```)/.test(lines[i])) {
          items[items.length - 1].cont.push(lines[i].trim())   // lazy continuation
          i++
        } else if (items.length && !lines[i].trim() && /^\s*([-*+]|\d+\.)\s+/.test(lines[i + 1] || '')) {
          i++
        } else break
      }
      html += buildList(items, 0, page)
      continue
    }

    if (!line.trim()) { i++; continue }

    // paragraph
    const buf = []
    while (i < lines.length && lines[i].trim() &&
      !/^(\s*([-*+]|\d+\.)\s+|>|#{1,6}\s|```|\s*\|)/.test(lines[i]) &&
      !/^\s*(---|\*\*\*|___)\s*$/.test(lines[i])) buf.push(lines[i++])
    html += `<p>${inline(buf.join('\n'), page)}</p>`
  }
  return { html, toc }
}

function buildList(items, start, page) {
  const base = items[start].indent
  const ordered = items[start].ordered
  let out = ordered ? '<ol>' : '<ul>'
  let i = start
  while (i < items.length && items[i].indent >= base) {
    if (items[i].indent > base) {
      const from = i
      while (i < items.length && items[i].indent > base) i++
      out = out.replace(/<\/li>$/, buildList(items, from, page) + '</li>')
      continue
    }
    const text = [items[i].text, ...items[i].cont].join('\n')
    out += `<li>${inline(text, page)}</li>`
    i++
  }
  return out + (ordered ? '</ol>' : '</ul>')
}

/* ------------------------------------------------------------------- routing */
const cache = new Map()
async function load(page) {
  if (!cache.has(page)) {
    const res = await fetch(`${page}.md`)
    if (!res.ok) throw new Error(String(res.status))
    cache.set(page, await res.text())
  }
  return cache.get(page)
}

function currentRoute() {
  const raw = location.hash.replace(/^#\/?/, '')
  const [path, anchor] = raw.split('#')
  return { page: path && path !== '' ? path.replace(/\/$/, '') : 'README', anchor }
}

async function route() {
  const { page, anchor } = currentRoute()
  const content = document.getElementById('content')
  let src
  try {
    src = await load(page)
  } catch {
    content.innerHTML = `<h1>Not found</h1><p>No page at <code>${esc(page)}.md</code>.</p><p><a href="#/">Back to the introduction</a></p>`
    document.getElementById('aside').innerHTML = ''
    document.getElementById('pager').innerHTML = ''
    return
  }

  const { html, toc } = render(src, page)
  content.innerHTML = html
  document.title = (content.querySelector('h1')?.textContent || 'Bakery') + ' | Bakery'

  // on-page contents
  const aside = document.getElementById('aside')
  aside.innerHTML = toc.length > 2
    ? `<div class="aside-title">On this page</div>` + toc.map(t =>
        `<a href="#/${page}#${t.id}" class="${t.lvl === 3 ? 'lvl3' : ''}" data-id="${t.id}">${esc(t.text)}</a>`).join('')
    : ''

  // sidebar active state
  document.querySelectorAll('.sb-link').forEach(a =>
    a.classList.toggle('active', a.dataset.page === page))

  // prev / next
  const idx = FLAT.findIndex(([p]) => p === page)
  const prev = idx > 0 ? FLAT[idx - 1] : null
  const next = idx >= 0 && idx < FLAT.length - 1 ? FLAT[idx + 1] : null
  document.getElementById('pager').innerHTML =
    (prev || next ? `<div class="pager">
      ${prev ? `<a href="#/${prev[0]}"><span class="p-dir">Previous</span>${prev[1]}</a>` : '<span style="flex:1"></span>'}
      ${next ? `<a class="next" href="#/${next[0]}"><span class="p-dir">Next</span>${next[1]}</a>` : '<span style="flex:1"></span>'}
    </div>` : '') +
    `<p class="edit-link"><a href="${REPO}/edit/main/docs/${page}.md" target="_blank" rel="noopener">Edit this page on GitHub</a></p>`

  document.body.classList.remove('menu-open')

  if (anchor) {
    // The element exists only after the innerHTML above, so this cannot move up.
    requestAnimationFrame(() => document.getElementById(anchor)?.scrollIntoView())
  } else {
    scrollTo(0, 0)
  }
  syncAside()
}

/* highlight the on-page-contents entry for whatever heading is in view */
function syncAside() {
  const links = [...document.querySelectorAll('.aside a')]
  if (!links.length) return
  let active = links[0]
  for (const link of links) {
    const el = document.getElementById(link.dataset.id)
    if (el && el.getBoundingClientRect().top < 140) active = link
  }
  links.forEach(l => l.classList.toggle('active', l === active))
}

/* --------------------------------------------------------------------- boot */
document.getElementById('sidebar').innerHTML = NAV.map(group =>
  `<div class="sb-group"><div class="sb-title">${group.title}</div>` +
  group.items.map(([p, label]) =>
    `<a class="sb-link" data-page="${p}" href="#/${p}">${label}</a>`).join('') +
  '</div>').join('')

const root = document.documentElement
const stored = localStorage.getItem('bakery-theme')
if (stored) root.dataset.theme = stored
document.getElementById('theme-btn').onclick = () => {
  const dark = matchMedia('(prefers-color-scheme: dark)').matches
  const now = root.dataset.theme || (dark ? 'dark' : 'light')
  const next = now === 'dark' ? 'light' : 'dark'
  root.dataset.theme = next
  localStorage.setItem('bakery-theme', next)
}
document.getElementById('menu-btn').onclick = () => document.body.classList.toggle('menu-open')
document.getElementById('scrim').onclick = () => document.body.classList.remove('menu-open')

document.addEventListener('click', e => {
  const btn = e.target.closest('.copy-btn')
  if (!btn) return
  navigator.clipboard.writeText(btn.parentElement.querySelector('code').innerText)
  btn.textContent = 'Copied'
  setTimeout(() => { btn.textContent = 'Copy' }, 1400)
})

/* search — the index is built on first use, not on load, so the page paints
   without waiting on 28 fetches nobody may want. */
let index = null
const box = document.getElementById('search')
const results = document.getElementById('results')

/**
 * Markdown source reduced to the words a reader would recognise.
 *
 * The index stores prose, not syntax. Without this a snippet reads
 * `- [CLI](reference/cli.md) - [Architecture](reference/arch…` — the link
 * targets crowd out the sentence, and a search for a word in a URL matches text
 * nobody can see on the page.
 */
function plain(line) {
  return line
    .replace(/!\[[^\]]*\]\([^)]*\)/g, '')
    .replace(/\[([^\]]+)\]\([^)]*\)/g, '$1')
    .replace(/[`*_>|]/g, '')
    .replace(/^\s*[-+]\s+/, '')
    .replace(/\s+/g, ' ')
    .trim()
}

async function buildIndex() {
  if (index) return index
  index = []
  await Promise.all(FLAT.map(async ([page, label]) => {
    let src
    try { src = await load(page) } catch { return }
    let section = label, body = [], inFence = false
    for (const line of src.split('\n')) {
      // Track the fence rather than skipping only the ``` line itself. The old
      // test let every line *inside* a code block into the index, so a snippet
      // could be a fragment of someone's example mid-identifier.
      if (/^```/.test(line)) { inFence = !inFence; continue }
      if (inFence) continue
      const h = /^(#{1,4})\s+(.*)$/.exec(line)
      if (h) {
        if (body.length) index.push({ page, label, section, id: slug(section), text: body.join(' ') })
        section = h[2].replace(/`/g, '').trim()
        body = []
      } else if (line.trim()) {
        const text = plain(line)
        if (text) body.push(text)
      }
    }
    if (body.length) index.push({ page, label, section, id: slug(section), text: body.join(' ') })
  }))
  return index
}

let selected = -1
async function search() {
  const q = box.value.trim().toLowerCase()
  if (q.length < 2) { results.classList.remove('open'); return }
  const idx = await buildIndex()
  const terms = q.split(/\s+/)
  const hits = idx.map(e => {
    const hay = (e.section + ' ' + e.text).toLowerCase()
    if (!terms.every(t => hay.includes(t))) return null
    let score = 0
    for (const t of terms) {
      if (e.section.toLowerCase().includes(t)) score += 12
      if (e.label.toLowerCase().includes(t)) score += 6
      score += Math.min(4, (hay.split(t).length - 1))
    }
    return { e, score }
  }).filter(Boolean).sort((a, b) => b.score - a.score).slice(0, 12)

  selected = -1
  results.innerHTML = hits.length
    ? hits.map(({ e }) => {
        // Window around the first hit, then advance to a word boundary —
        // slicing at a fixed offset otherwise opens the snippet mid-word
        // ("ation-supplied authorization predicate"), which reads as corruption.
        const pos = e.text.toLowerCase().indexOf(terms[0])
        const from = pos >= 0 ? Math.max(0, pos - 40) : 0
        let snip = e.text.slice(from, from + 130)
        if (from > 0) snip = '…' + snip.slice(snip.indexOf(' ') + 1)
        return `<a href="#/${e.page}#${e.id}"><span class="r-crumb">${esc(e.label)}</span>` +
          `<span class="r-title">${esc(e.section)}</span>` +
          `<span class="r-snip">${esc(snip)}…</span></a>`
      }).join('')
    : '<div class="empty">No matches</div>'
  results.classList.add('open')
}

box.addEventListener('input', search)
box.addEventListener('keydown', e => {
  const links = [...results.querySelectorAll('a')]
  if (e.key === 'Escape') { box.blur(); results.classList.remove('open'); return }
  if (!links.length) return
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault()
    selected = (selected + (e.key === 'ArrowDown' ? 1 : -1) + links.length) % links.length
    links.forEach((l, i) => l.classList.toggle('sel', i === selected))
    links[selected].scrollIntoView({ block: 'nearest' })
  } else if (e.key === 'Enter' && selected >= 0) {
    location.hash = links[selected].getAttribute('href')
    box.blur(); results.classList.remove('open'); box.value = ''
  }
})
document.addEventListener('click', e => {
  if (!e.target.closest('.search-wrap')) results.classList.remove('open')
})
results.addEventListener('click', () => { results.classList.remove('open'); box.value = '' })
addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== box) { e.preventDefault(); box.focus() }
})

addEventListener('hashchange', route)
addEventListener('scroll', syncAside, { passive: true })
route()
</script>
</body>
</html>
