<svg xmlns="http://www.w3.org/2000/svg" width="819" height="819" viewBox="0 -9 819 819" fill="none" role="img" aria-label="Bakery">
  <title>Bakery</title>
  <!--
    The docs copy. Same drawing as assets/logo.svg, cropped to the mark.
    
    The published logo carries space around it on purpose — an avatar gets
    cropped to a circle and a mark touching the edge loses its outline. A
    header slot is the opposite case: the box is already small, so that same
    space renders the mark smaller than the wordmark beside it. Measured, the
    original left about 50px a side of empty box.
    
    Square and centred on the ink, since this file is the favicon as well.
  -->
    <desc>A bun wearing a chef's hat.</desc>

  <!--
    Paths, colours, filters and layer order are the export's own. Two things
    about the frame are not.

    The export painted a white rect across the whole canvas. On a dark README
    that is not a background, it is a white plate the mark sits on, with hard
    corners the page has no way to knock off. Removed; the mark is transparent
    now and reads on either theme.

    The export also framed tight. Measured off a render with the frame opened up
    on all sides, the ink runs x 0..818 and y 0..801 against a viewBox of
    819x802: it touches all four edges exactly, with nothing outside and nothing
    spare. That is fine inline, and wrong everywhere a logo gets put into a box
    it does not control, since npm, GitHub and favicons all crop to a square or
    a circle and would bite into the outline. The viewBox is squared and padded
    here rather than the artwork being moved, so the geometry and the filter
    regions, which are in user space and absolute, both stay where they were.

    One thing is added rather than fixed. The cuff was flat while everything
    around it was lit, so it carries an inner shadow now on the same terms as
    the other two: 43 right, 13 up, blur 14.1, black at a quarter opacity.
    Figma states that blur as twice the Gaussian deviation, so 14.1 is a
    stdDeviation of 7.05, which is the figure the hat above it already used.

    The cuff arrived with its fill and its stroke on one element. Filtering
    that directly would have shaded the outline too, since the shadow is cut
    against SourceAlpha and the stroke is part of it. It is split into a
    filtered fill and a separate stroke over the top, which is how the bun and
    the hat were already built.
  -->
